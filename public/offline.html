<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#16a5e1" />
    <title>Offline — AptFindr</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#f2f6fa;color:#172033;font:16px/1.5 system-ui,sans-serif}.card{width:min(100%,28rem);padding:2rem;border:1px solid #bae6fd;border-radius:1rem;background:#fff;box-shadow:0 20px 50px #0f172a14;text-align:center}img{width:5rem;height:auto;max-height:5rem;object-fit:contain;object-position:center}h1{margin:.75rem 0 .5rem;font-size:1.75rem}p{margin:0 0 1.25rem;color:#64748b}button{border:0;border-radius:.75rem;padding:.75rem 1rem;background:#16a5e1;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #0f172a;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/aptfindr-logo.png?v=8" alt="" />
      <h1>You’re offline</h1>
      <p>AptFindr’s saved app screens may still be available, but live listings, sign-in, and changes need an internet connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
